name: Run unit tests

on:
  push:
    paths:
      - "custom_components/solis_cloud_monitoring/**"
      - "tests/**"
      - "tests_runtime/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "custom_components/solis_cloud_monitoring/**"
      - "tests/**"
      - "tests_runtime/**"
      - ".github/workflows/tests.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest==9.0.2 aiohttp==3.13.3
      - name: Run existing regressions
        run: python -m pytest -q tests
      - name: Run API boundary regressions with real aiohttp
        # Legacy tests stub sys.modules, so use a separate process.
        run: python -m pytest -q tests_runtime/test_api_errors.py
  config-flow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            homeassistant: "2024.8.3"
          - python: "3.14.2"
            homeassistant: "2026.9.3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real Home Assistant
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HA_VERSION" == "2024.8.3" ]]; then
            # Recreate the older HA dependency family, not today's unrelated
            # transitive versions. These constraints apply only to this CI job.
            python -m pip install pytest==9.0.2 "homeassistant==$HA_VERSION" \
              -c "https://raw.githubusercontent.com/home-assistant/core/2024.8.3/homeassistant/package_constraints.txt" \
              "josepy<2" "pycares<5"
          else
            python -m pip install pytest==9.0.2 "homeassistant==$HA_VERSION"
          fi
      - name: Run config-flow regressions with real HA helpers
        run: python -m pytest -q tests_runtime/test_config_flow_errors.py
